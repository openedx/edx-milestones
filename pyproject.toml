[build-system]
requires = ["setuptools", "setuptools-scm>8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "edx-milestones"
description = "Significant events module for Open edX"
requires-python = ">=3.12"
license = "AGPL-3.0"
license-files = ["LICENSE*"]
authors = [
    {name = "Open edX Project", email = "oscm@openedx.org"},
]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Environment :: Web Environment',
    'Framework :: Django',
    'Framework :: Django :: 4.2',
    'Framework :: Django :: 5.2',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
]
keywords = [
    "Python",
    "edx",
]

dynamic = ["readme", "version"]

dependencies = [
    "Django",
    "django-model-utils",
    "edx-opaque-keys>=0.2.1",
    "six",
    "setuptools",
]

[project.urls]
Homepage = "https://github.com/openedx/edx-milestones"
Repository = "https://github.com/openedx/edx-milestones"

[dependency-groups]
test-base = [
    "code-annotations",
    "coverage",
    "pytest",
    "pytest-django",
    "pytest-cov",
]
test = [
    {include-group = "test-base"},
    "Django>=5.2,<6.0",
]
django42 = [
    {include-group = "test-base"},
    "Django>=4.2,<5.0",
]
quality = [
    {include-group = "test"},
    "edx-lint",
    "isort",
    "pycodestyle",
    "pydocstyle",
]
ci = [
    "tox",
    "tox-uv",
    "pip",
    "wheel",
]
dev = [
    {include-group = "quality"},
    {include-group = "ci"},
    "setuptools-scm>=10.3.4",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = []

[tool.semantic_release]
build_command = "pip install build && SETUPTOOLS_SCM_PRETEND_VERSION=$NEW_VERSION python -m build"

[tool.setuptools_scm]
version_scheme = 'only-version'
local_scheme = 'no-local-version'
fallback_version = "0.0.0"

[tool.uv]
conflicts = [
    [{group = "test"}, {group = "django42"}],
]
constraint-dependencies = [
    "Django<6.0",
    "elasticsearch<7.14.0",
    "social-auth-app-django<6.0.0",
    "social-auth-core<5.0.0",
    "pip<26.2.1",
]

[tool.edx_lint]
uv_constraints = []

[tool.coverage.run]
branch = true
source_pkgs = ["milestones"]
omit = [
    "**/__init__.py",
    "**/migrations/*",
]

[tool.coverage.report]
show_missing = true

[tool.isort]
indent = '    '
line_length = 120
multi_line_output = 3

